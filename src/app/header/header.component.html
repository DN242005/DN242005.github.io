<tr *ngIf="header">
  <td>
    <strong>{{ header.name }}</strong><br>
    {{ header.goalLife }}
  </td>
  <td>
    <img [src]="header.photoUrl" width="200" height="200" alt="Foto de {{ header.name }}">
  </td>
  <td>
    {{ header.email }}<br>
    {{ header.phoneNumber }}<br>
    {{ header.location }}<br>
    {{ header.socialNetwork }}
  </td>
</tr>
